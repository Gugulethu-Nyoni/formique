<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Vue 3 and Formique App</title>


<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/formique-css@1.0.6/formique.min.css" formique-style>

  <!-- Include Vue 3 CDN -->
  <script src="https://unpkg.com/vue@3/dist/vue.global.js"></script>

  <!-- Include Formique CDN -->
  <script src="https://cdn.jsdelivr.net/npm/formique@1.0.8/formique.umd.min.js"></script>
</head>
<body>
  <div id="app"></div> <!-- Vue app will be mounted here -->

  <script>
    // Create a Vue 3 component
    const UserForm = {
      data() {
        return {
          formSchema: [
            ['text', 'name', 'Name', { required: true }, {}],
            ['email', 'email', 'Email', { required: true }, {}],
            ['singleSelect', 'diet', 'Dietary Requirements', { required: true }, {}, [
              { value: 'gluten-free', label: 'Gluten-free' },
              { value: 'vegetarian', label: 'Vegetarian' },
            ]],
            ['submit', 'submitButton', 'Submit']
          ],
          formParams: {
            method: 'post',
            action: 'submit.js',
            id: 'myForm',
            class: 'form',
            style: 'width: 100%; font-size: 14px;'
          },
          formSettings: {
            requiredFieldIndicator: true,
            framework: 'semantq',
            placeholders: true,
            
          }


        };
      },
      mounted() {
  if (window.Formique) {
    new window.Formique(this.formSchema, this.formParams, this.formSettings);
  } else {
    console.error("Formique is not loaded.");
  }
},
      template: `
        <div>
          <h1>Users Reg Form Here</h1>
          <div id="formique"></div>
        </div>
      `
    };

    // Create and mount the Vue app
    Vue.createApp(UserForm).mount('#app');
  </script>
</body>
</html>
