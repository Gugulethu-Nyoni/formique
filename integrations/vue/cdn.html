<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Vue 3 and Formique App</title>


<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/formique-css@1.0.6/formique.min.css" formique-style>

  <!-- Include Vue 3 CDN -->
  <script src="https://unpkg.com/vue@3/dist/vue.global.js"></script>

  <!-- Include Formique CDN -->
  <script src="https://cdn.jsdelivr.net/npm/formique/formique.umd.min.js"></script>
</head>
<body>
  <div id="app"></div> <!-- Vue app will be mounted here -->

  <script>
    // Create a Vue 3 component
    const UserForm = {
      data() {
        return {
          formSchema: [
            ['text', 'name', 'Name', { required: true }, {}],
            ['text','surname','Surname',{required: true}],
            ['email', 'email', 'Email', { required: true }, {}],
            ['singleSelect', 'title', 'Title', { required: true }, {dependents: ['status']}, [
              { value: 'mr', label: 'Mr' },
              { value: 'ms', label: 'Ms' },
              { value: 'mrs', label: 'mrs' },
              { value: 'dr', label: 'Dr'},
              { value: 'prof', label: 'Prof'}
            ]],
            ['singleSelect', 'status','Status',{required: true}, {dependsOn: 'title', condition: (value) => value === 'prof'}, 
              [
                {value: 'full professor', label: 'Full Professor'},
                {value: 'associate professor', label: 'Associate Professor'}

              ]
            ],


            ['submit', 'submit', 'Submit',{},{style:'width: 100%;'}]
          ],


          formParams: {
            method: 'post',
            //action: 'submit.js',
            id: 'myForm',
            class: 'form',
            style: 'width: 100%; font-size: 14px;'
          },
          formSettings: {
            requiredFieldIndicator: true,
            framework: 'vue',
            placeholders: true,
            theme: 'dark-blue',
            submitOnPage: true
          }
        };
      },
      mounted() {
  if (window.Formique) {
    new window.Formique(this.formSchema, this.formParams, this.formSettings);
  } else {
    console.error("Formique is not loaded.");
  }
},
      template: `
        <div>
          <h1>Users Reg Form Here</h1>
          <div id="formique"></div>
        </div>
      `
    };

    // Create and mount the Vue app
    Vue.createApp(UserForm).mount('#app');
  </script>
</body>
</html>
